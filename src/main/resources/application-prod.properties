# Active with SPRING_PROFILES_ACTIVE=prod. No defaults for secrets:
# a missing env var fails the startup instead of silently using a dev value.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.cors.origins=${FRONT_ORIGIN}
app.front-url=${FRONT_URL}
# the API map (incl. admin endpoints) is not public in prod; use Swagger locally
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
