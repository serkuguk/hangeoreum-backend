spring.application.name=hangeoreum-api
server.port=${SERVER_PORT:8082}
# trust X-Forwarded-For only from local/private proxies (nginx) so the auth rate limit sees real client IPs
server.forward-headers-strategy=native
# every value can be overridden by a server env var (see deploy/windows/coreano-api.env.example);
# defaults below are for local dev only, the prod profile drops them for secrets
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hangeoreum}
spring.datasource.username=${DB_USERNAME:hangeoreum}
spring.datasource.password=${DB_PASSWORD:hangeoreum}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# compose.yaml already applies schema.sql as init script; Flyway baselines over it
spring.flyway.baseline-on-migrate=true

# postgres is managed manually (docker start hangeoreum-postgres); the Docker Desktop
# API pipe is not reachable from the JVM on this machine, so compose support is off
spring.docker.compose.enabled=false

# Jackson 3 default rejects missing/null values for primitive DTO fields — keep Jackson 2 behavior
spring.jackson.deserialization.fail-on-null-for-primitives=false

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

app.jwt.secret=${JWT_SECRET:hangeoreum-dev-secret-key-change-in-prod-32b!}
app.jwt.access-minutes=${JWT_ACCESS_MINUTES:15}
app.jwt.refresh-days=${JWT_REFRESH_DAYS:30}
# login/register/password-reset POSTs per client IP per minute
app.auth.rate-limit-per-minute=${AUTH_RATE_LIMIT_PER_MINUTE:10}
app.cors.origins=${FRONT_ORIGIN:http://localhost:4200}
app.front-url=${FRONT_URL:http://localhost:4200}
app.mail.from=${SMTP_FROM:noreply@hangeoreum.local}
app.storage.dir=${MEDIA_DIR:./uploads}
# lesson completion is a chain of outbox events (LessonCompleted -> XP -> words) and the UI waits for it;
# each hop waits one tick, so 5s ticks meant 10s+ of "saving...". The ready query hits a partial index.
app.outbox.fixed-delay-ms=${OUTBOX_DELAY_MS:300}
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL_ENABLE:false}
